openapi: "3.0.3"
info:
  title: Calloway API
  description: |
    AI operational assistant for solo real estate agents. Calloway automates
    client communication, lead management, scheduling, and business intelligence.

    ## Authentication

    **Operator Console** (`/console/*`): Password-based session auth via
    `console_session` cookie. Login at `POST /console/login`.

    **Agent Portal** (`/agent/*`): SMS-code-based session auth via
    `agent_session` cookie. Login at `POST /agent/login`.

    **Webhooks** (`/webhooks/*`, `/billing/webhooks/*`): Verified via
    provider-specific signatures (Twilio `X-Twilio-Signature`, Stripe
    `stripe-signature`, Vapi `x-vapi-secret`).

    **Harness** (`/harness/*`): Requires operator console session.

    **Onboarding** (`/onboarding/*`): Unauthenticated (intended for
    provisioning scripts).

    **Health** (`/health/*`): Unauthenticated.

    ## Response Formats

    - Console and Agent Portal `GET` routes return **HTML** (Jinja2 templates).
    - Console and Agent Portal `POST` routes return **HTML** or **303 redirects**.
    - Webhook, health, onboarding, and harness API routes return **JSON**.
  version: "1.0.0"
  contact:
    name: Calloway Engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://app.calloway.ai
    description: Production

tags:
  - name: Health
    description: Service health checks and operational metrics.
  - name: Webhooks
    description: Inbound message and voice webhooks (Twilio, Vapi, SendGrid).
  - name: Billing Webhooks
    description: Stripe payment webhooks.
  - name: Onboarding
    description: Agent provisioning and onboarding checklist.
  - name: Console / Auth
    description: Operator console login and logout.
  - name: Console / Dashboard
    description: Operator dashboard and activity feed.
  - name: Console / Onboard Wizard
    description: Guided agent onboarding from the operator console.
  - name: Console / Customers
    description: Tenant (agent) CRUD, detail views, and actions.
  - name: Console / Messages
    description: Conversation listing and detail views.
  - name: Console / Automations
    description: Trigger queue management (retry, cancel, fire-now).
  - name: Console / Billing
    description: Subscription management, cost dashboards, plan changes.
  - name: Console / System Health
    description: System health overview, error log, manual daily scan.
  - name: Console / Knowledge Base
    description: Per-agent RAG knowledge base management.
  - name: Console / Help
    description: User manual page.
  - name: Conversations
    description: Token-authenticated conversation deep-link view.
  - name: Agent Portal / Auth
    description: Agent login via SMS code.
  - name: Agent Portal / Dashboard
    description: Agent-facing dashboard.
  - name: Agent Portal / Contacts
    description: Agent contact list and editing.
  - name: Agent Portal / Conversations
    description: Agent conversation list and reply.
  - name: Agent Portal / Schedule
    description: Agent showing schedule.
  - name: Agent Portal / Triggers
    description: Agent trigger/reminder management.
  - name: Agent Portal / Transactions
    description: Agent transaction pipeline.
  - name: Agent Portal / Lead Scores
    description: AI-computed lead scoring.
  - name: Agent Portal / Campaigns
    description: Drip campaign management.
  - name: Harness
    description: Testing harness -- message injection, trace history, scenario runner.

# ────────────────────────────────────────────────────────────
# Reusable components
# ────────────────────────────────────────────────────────────
components:
  securitySchemes:
    ConsoleSession:
      type: apiKey
      in: cookie
      name: console_session
      description: Signed session cookie set after successful console login.
    AgentSession:
      type: apiKey
      in: cookie
      name: agent_session
      description: Signed session cookie set after successful agent portal login.
    TwilioSignature:
      type: apiKey
      in: header
      name: X-Twilio-Signature
      description: HMAC signature generated by Twilio.
    StripeSignature:
      type: apiKey
      in: header
      name: stripe-signature
      description: Stripe webhook signature.
    VapiSecret:
      type: apiKey
      in: header
      name: x-vapi-secret
      description: Shared secret for Vapi webhook verification.

  schemas:
    # ── Shared ──
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: "Not found"

    StatusOk:
      type: object
      properties:
        status:
          type: string
          example: ok

    # ── Health ──
    BasicHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      example:
        status: ok

    DetailedHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
        redis:
          type: string
        anthropic:
          type: string
      example:
        status: ok
        database: ok
        redis: ok
        anthropic: configured

    HealthMetrics:
      type: object
      properties:
        agents:
          type: integer
        contacts:
          type: integer
        messages_today:
          type: integer
        pending_triggers:
          type: integer
      example:
        agents: 12
        contacts: 347
        messages_today: 89
        pending_triggers: 5

    # ── Onboarding ──
    OnboardingRequest:
      type: object
      required: [name, email, phone, twilio_number]
      properties:
        name:
          type: string
          example: "Jane Doe"
        email:
          type: string
          format: email
          example: "jane@realty.com"
        phone:
          type: string
          example: "+15551234567"
        twilio_number:
          type: string
          example: "+15559876543"
        brokerage:
          type: string
          nullable: true
          example: "Keller Williams"
        market:
          type: string
          nullable: true
          example: "Austin, TX"
        timezone:
          type: string
          default: "America/New_York"
          example: "America/Chicago"
        style_tone:
          type: string
          default: professional
          example: professional
        autonomy_level:
          type: string
          default: moderate
          example: moderate

    OnboardingResponse:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        status:
          type: string
          example: created
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"

    ChecklistItem:
      type: object
      properties:
        step:
          type: string
        label:
          type: string
        done:
          type: boolean

    OnboardingChecklist:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        progress:
          type: string
          example: "3/7"
        pct:
          type: integer
          example: 43
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"

    # ── Harness ──
    InjectRequest:
      type: object
      required: [agent_id, sender_phone, message_body]
      properties:
        agent_id:
          type: string
          format: uuid
        sender_phone:
          type: string
          example: "+15551112222"
        sender_name:
          type: string
          nullable: true
        message_body:
          type: string
          example: "I'd like to schedule a showing for 123 Main St"
        channel:
          type: string
          default: sms
          enum: [sms, rcs, vapi, email]
        dry_run:
          type: boolean
          default: true

    PipelineTrace:
      type: object
      properties:
        trace_id:
          type: string
        agent_id:
          type: string
          format: uuid
        dry_run:
          type: boolean
        stages:
          type: array
          items:
            type: object
            properties:
              stage_name:
                type: string
              status:
                type: string
              duration_ms:
                type: integer
              input_summary:
                type: object
              output_summary:
                type: object
              error_message:
                type: string
                nullable: true
        intent_detected:
          type: string
          nullable: true
        handler_used:
          type: string
          nullable: true
        model_used:
          type: string
          nullable: true
        tokens_used:
          type: integer
          nullable: true
        response_text:
          type: string
          nullable: true
        outbound_actions:
          type: array
          items:
            type: object
        total_duration_ms:
          type: integer

    # ── TwiML (XML response) ──
    TwiMLResponse:
      type: string
      description: TwiML XML envelope.
      example: '<?xml version="1.0" encoding="UTF-8"?><Response></Response>'

# ────────────────────────────────────────────────────────────
# Paths
# ────────────────────────────────────────────────────────────
paths:
  # ===========================================================
  # Health
  # ===========================================================
  /health:
    get:
      tags: [Health]
      summary: Basic health check
      description: Returns `{"status":"ok"}`. Always fast; no dependency checks.
      operationId: healthCheck
      responses:
        "200":
          description: Service is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicHealth"

  /health/detailed:
    get:
      tags: [Health]
      summary: Detailed health check
      description: Tests database, Redis, and Anthropic API key configuration.
      operationId: detailedHealthCheck
      responses:
        "200":
          description: Health details (status may be `degraded`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedHealth"

  /health/metrics:
    get:
      tags: [Health]
      summary: Quick operational metrics
      description: Returns counts of agents, contacts, today's messages, and pending triggers.
      operationId: healthMetrics
      responses:
        "200":
          description: Operational metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthMetrics"

  # ===========================================================
  # Webhooks — Twilio
  # ===========================================================
  /webhooks/twilio/inbound:
    post:
      tags: [Webhooks]
      summary: Receive inbound SMS/RCS from Twilio
      description: |
        Twilio posts form-encoded message data. The endpoint validates the
        `X-Twilio-Signature`, resolves the receiving agent, and enqueues the
        message for async pipeline processing. Returns TwiML immediately.
      operationId: twilioInbound
      security:
        - TwilioSignature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                From:
                  type: string
                  description: Sender phone number.
                To:
                  type: string
                  description: Receiving Twilio number.
                Body:
                  type: string
                  description: Message body.
                MessageSid:
                  type: string
                  description: Twilio message SID.
      responses:
        "200":
          description: TwiML acknowledgment.
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/TwiMLResponse"
        "403":
          description: Invalid Twilio signature.

  /webhooks/twilio/status:
    post:
      tags: [Webhooks]
      summary: Receive delivery status callbacks from Twilio
      description: |
        Updates message delivery status in the database. Handles delivered,
        read, failed, undelivered, and intermediate statuses.
      operationId: twilioStatus
      security:
        - TwilioSignature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                MessageSid:
                  type: string
                MessageStatus:
                  type: string
                  enum: [queued, sending, sent, delivered, read, failed, undelivered]
                ErrorCode:
                  type: string
                ErrorMessage:
                  type: string
      responses:
        "200":
          description: TwiML acknowledgment.
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/TwiMLResponse"

  /webhooks/twilio/voice:
    post:
      tags: [Webhooks]
      summary: Handle inbound voice calls
      description: |
        Rings the agent's personal phone for 20 seconds, then falls back to
        the Vapi voice assistant via `/webhooks/twilio/voice-fallback`.
      operationId: twilioVoice
      security:
        - TwilioSignature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                To:
                  type: string
                From:
                  type: string
                CallSid:
                  type: string
      responses:
        "200":
          description: TwiML with Dial instruction.
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/TwiMLResponse"

  /webhooks/twilio/voice-fallback:
    post:
      tags: [Webhooks]
      summary: Voice fallback when agent does not answer
      description: |
        Called by Twilio when the Dial in `/webhooks/twilio/voice` completes.
        If the agent did not answer, greets the caller with the AI assistant.
      operationId: twilioVoiceFallback
      security:
        - TwilioSignature: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                DialCallStatus:
                  type: string
                  enum: [completed, no-answer, busy, failed]
      responses:
        "200":
          description: TwiML response.
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/TwiMLResponse"

  # ===========================================================
  # Webhooks — Vapi
  # ===========================================================
  /webhooks/vapi/post-call:
    post:
      tags: [Webhooks]
      summary: Process Vapi post-call transcript
      description: |
        Receives the call transcript from Vapi after a voice call ends.
        Processes through the full pipeline and sends a follow-up SMS to
        the caller.
      operationId: vapiPostCall
      security:
        - VapiSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                call_id:
                  type: string
                phoneNumber:
                  type: object
                  properties:
                    number:
                      type: string
                transcript:
                  type: string
                duration:
                  type: integer
                  description: Call duration in seconds.
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "401":
          description: Invalid or missing Vapi secret.

  # ===========================================================
  # Webhooks — Email (SendGrid)
  # ===========================================================
  /webhooks/email/inbound:
    post:
      tags: [Webhooks]
      summary: Receive inbound email via SendGrid Inbound Parse
      description: |
        Receives parsed email data from SendGrid. Resolves agent from the
        To address, archives the email, and processes through the pipeline.
      operationId: emailInbound
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                to:
                  type: string
                from:
                  type: string
                subject:
                  type: string
                text:
                  type: string
                html:
                  type: string
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"

  # ===========================================================
  # Billing Webhooks — Stripe
  # ===========================================================
  /billing/webhooks/stripe:
    post:
      tags: [Billing Webhooks]
      summary: Handle Stripe webhook events
      description: |
        Processes subscription updates, invoice payments, and payment failures.
        Validates the `stripe-signature` header.
      operationId: stripeWebhook
      security:
        - StripeSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload.
      responses:
        "200":
          description: Event processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          description: Invalid signature.
        "500":
          description: Webhook secret not configured.

  # ===========================================================
  # Onboarding
  # ===========================================================
  /onboarding/agent:
    post:
      tags: [Onboarding]
      summary: Create a new agent
      description: Creates a new agent record and returns an onboarding checklist.
      operationId: onboardAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "200":
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
        "409":
          description: Agent with this phone or Twilio number already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/checklist/{agent_id}:
    get:
      tags: [Onboarding]
      summary: Get onboarding progress
      description: Returns the onboarding checklist with completion status for each step.
      operationId: getOnboardingChecklist
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Checklist with progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingChecklist"
        "404":
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ===========================================================
  # Conversations (token-authenticated deep link)
  # ===========================================================
  /conversations/{contact_id}:
    get:
      tags: [Conversations]
      summary: View conversation (token-authenticated)
      description: |
        Renders a minimal HTML conversation view for a contact. Requires a
        signed URL token (generated server-side for push notifications).
        Token expires after 24 hours.
      operationId: viewConversation
      parameters:
        - name: contact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Signed URL token for authentication.
      responses:
        "200":
          description: HTML conversation view.
          content:
            text/html:
              schema:
                type: string
        "403":
          description: Invalid or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ===========================================================
  # Console — Auth
  # ===========================================================
  /console/login:
    get:
      tags: [Console / Auth]
      summary: Login page
      description: Renders the operator console login form.
      operationId: consoleLoginPage
      responses:
        "200":
          description: HTML login page.
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Console / Auth]
      summary: Submit login
      description: |
        Authenticates with the console password. On success, sets a
        `console_session` cookie and redirects to dashboard.
      operationId: consoleLoginSubmit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "303":
          description: Redirect to dashboard on success.
        "200":
          description: HTML login page with error on failure.
          content:
            text/html:
              schema:
                type: string

  /console/logout:
    get:
      tags: [Console / Auth]
      summary: Logout
      description: Clears the session cookie and redirects to login.
      operationId: consoleLogout
      security:
        - ConsoleSession: []
      responses:
        "303":
          description: Redirect to login page.

  # ===========================================================
  # Console — Dashboard
  # ===========================================================
  /console/:
    get:
      tags: [Console / Dashboard]
      summary: Console root redirect
      description: Redirects to `/console/dashboard`.
      operationId: consoleRoot
      security:
        - ConsoleSession: []
      responses:
        "303":
          description: Redirect to dashboard.

  /console/dashboard:
    get:
      tags: [Console / Dashboard]
      summary: Operator dashboard
      description: |
        Renders the main dashboard with system pulse, recent activity, and
        agents needing attention.
      operationId: consoleDashboard
      security:
        - ConsoleSession: []
      responses:
        "200":
          description: HTML dashboard.
          content:
            text/html:
              schema:
                type: string
        "303":
          description: Redirect to login if unauthenticated.

  /console/dashboard/activity-feed:
    get:
      tags: [Console / Dashboard]
      summary: Activity feed (HTMX partial)
      description: Returns an HTML fragment of the latest activity for HTMX polling.
      operationId: consoleDashboardActivityFeed
      security:
        - ConsoleSession: []
      responses:
        "200":
          description: HTML fragment.
          content:
            text/html:
              schema:
                type: string

  # ===========================================================
  # Console — Onboard Wizard
  # ===========================================================
  /console/onboard:
    get:
      tags: [Console / Onboard Wizard]
      summary: Onboard wizard form
      description: Renders the guided agent onboarding wizard.
      operationId: consoleOnboardWizard
      security:
        - ConsoleSession: []
      responses:
        "200":
          description: HTML wizard form.
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Console / Onboard Wizard]
      summary: Submit onboard wizard
      description: Creates a new agent from the wizard form data.
      operationId: consoleOnboardSubmit
      security:
        - ConsoleSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrf_token:
                  type: string
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                twilio_number:
                  type: string
      responses:
        "200":
          description: HTML success or error page.
          content:
            text/html:
              schema:
                type: string

  # ===========================================================
  # Console — Customers (Tenants)
  # ===========================================================
  /console/tenants:
    get:
      tags: [Console / Customers]
      summary: List all customers
      description: |
        Renders the tenant list. Supports search and sort query params.
        Also supports `Accept: application/json` for JSON responses.
      operationId: consoleTenantList
      security:
        - ConsoleSession: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Filter by name or market.
        - name: sort
          in: query
          schema:
            type: string
            default: name
          description: Sort field.
      responses:
        "200":
          description: HTML tenant list or JSON array.
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string

  /console/tenants/new:
    get:
      tags: [Console / Customers]
      summary: New customer form
      operationId: consoleTenantNewForm
      security:
        - ConsoleSession: []
      responses:
        "200":
          description: HTML form.
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Console / Customers]
      summary: Create a new customer
      operationId: consoleTenantCreate
      security:
        - ConsoleSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrf_token:
                  type: string
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                twilio_number:
                  type: string
      responses:
        "303":
          description: Redirect to new tenant detail on success.
        "200":
          description: HTML form with validation error.
          content:
            text/html:
              schema:
                type: string

  /console/tenants/{agent_id}:
    get:
      tags: [Console / Customers]
      summary: Customer detail page
      description: Full detail view for a single agent/tenant.
      operationId: consoleTenantDetail
      security:
        - ConsoleSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: HTML detail page.
          content:
            text/html:
              schema:
                type: string
        "303":
          description: Redirect to tenant list if not found.

  /console/tenants/{agent_id}/edit:
    get:
      tags: [Console / Customers]
      summary: Customer edit form
      operationId: consoleTenantEditForm
      security:
        - ConsoleSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: HTML edit form.
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Console / Customers]
      summary: Update customer
      operationId: consoleTenantUpdate
      security:
        - ConsoleSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
