  /console/tenants/{agent_id}/kb/{source_type}/{source_id}/remove:
    post:
      tags: [Console / Knowledge Base]
      summary: Remove KB item
      description: Deletes all embedding chunks for the specified source.
      operationId: consoleTenantKbRemove
      security:
        - ConsoleSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: source_type
          in: path
          required: true
          schema:
            type: string
            enum: [conversation, contact, listing, document]
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrf_token:
                  type: string
      responses:
        "303":
          description: Redirect to tenant KB tab.

  /console/tenants/{agent_id}/kb/{source_type}/{source_id}/reindex:
    post:
      tags: [Console / Knowledge Base]
      summary: Re-index KB item
      description: |
        Re-reads the source data and re-embeds all chunks. Not supported
        for `document` source type (no upstream source to re-read).
      operationId: consoleTenantKbReindex
      security:
        - ConsoleSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: source_type
          in: path
          required: true
          schema:
            type: string
            enum: [conversation, contact, listing]
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrf_token:
                  type: string
      responses:
        "303":
          description: Redirect to tenant KB tab.

  /console/tenants/{agent_id}/kb/{source_type}/{source_id}/expire:
    post:
      tags: [Console / Knowledge Base]
      summary: Set KB item expiration
      description: Sets or clears an expiration date on a KB item.
      operationId: consoleTenantKbSetExpiration
      security:
        - ConsoleSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: source_type
          in: path
          required: true
          schema:
            type: string
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrf_token:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: ISO 8601 datetime. Omit or empty to clear.
      responses:
        "303":
          description: Redirect to tenant KB tab.
        "400":
          description: Invalid or past expiration date.

  /console/tenants/{agent_id}/kb/settings:
    post:
      tags: [Console / Knowledge Base]
      summary: Update KB settings
      description: Updates the KB expiration policy and default TTL for an agent.
      operationId: consoleTenantKbUpdateSettings
      security:
        - ConsoleSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                csrf_token:
                  type: string
                kb_expiration_policy:
                  type: string
                  enum: [remind_only, auto_expire, manual]
                  default: remind_only
                kb_default_ttl_days:
                  type: integer
                  nullable: true
      responses:
        "303":
          description: Redirect to tenant KB tab.
        "400":
          description: Invalid settings value.

  /console/tenants/{agent_id}/kb/upload:
    post:
      tags: [Console / Knowledge Base]
      summary: Upload KB document
      description: |
        Uploads a text document, chunks it, generates embeddings, and stores
        in the knowledge base. Maximum 50,000 characters.
      operationId: consoleTenantKbUpload
      security:
        - ConsoleSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, title, content]
              properties:
                csrf_token:
                  type: string
                title:
                  type: string
                  description: Document title.
                content:
                  type: string
                  description: Document text content (max 50,000 chars).
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "303":
          description: Redirect to tenant KB tab.
        "400":
          description: Validation error (missing title/content, too large).
        "500":
          description: Upload processing failure.

  # ===========================================================
  # Agent Portal — Auth
  # ===========================================================
  /agent/login:
    get:
      tags: [Agent Portal / Auth]
      summary: Agent login page
      description: Renders the agent portal login form (phone + SMS code).
      operationId: agentLoginPage
      responses:
        "200":
          description: HTML login page.
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Agent Portal / Auth]
      summary: Agent login submit
      description: |
        Two-step flow: (1) Submit phone only to receive SMS code.
        (2) Submit phone + code to authenticate.
      operationId: agentLoginSubmit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: Agent phone number.
                code:
                  type: string
                  description: 6-digit SMS verification code (omit on first request).
      responses:
        "303":
          description: Redirect to dashboard on successful login.
        "200":
          description: HTML page with message (code sent) or error.
          content:
            text/html:
              schema:
                type: string

  /agent/logout:
    get:
      tags: [Agent Portal / Auth]
      summary: Agent logout
      description: Clears agent session and redirects to login.
      operationId: agentLogout
      security:
        - AgentSession: []
      responses:
        "303":
          description: Redirect to login page.

