      description: Returns JSON list of contacts for the dropdown in the message composer.
      operationId: harnessAgentContacts
      security:
        - ConsoleSession: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contact list.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    phone:
                      type: string
                    role:
                      type: string
