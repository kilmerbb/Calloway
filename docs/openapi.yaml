  # ===========================================================
  # Harness
  # ===========================================================
  /harness/:
    get:
      tags: [Harness]
      summary: Harness home (message composer)
      description: Renders the message composer UI for testing.
      operationId: harnessHome
      security:
        - ConsoleSession: []
      responses:
        "200":
          description: HTML composer page.
          content:
            text/html:
              schema:
                type: string
        "303":
          description: Redirect to login if unauthenticated.

  /harness/inject:
    post:
      tags: [Harness]
      summary: Inject a test message
      description: |
        Simulates an inbound message through the full pipeline and returns
        a detailed trace of every stage. Does NOT store the trace (use
        `/harness/inject-and-store` for persistence).
      operationId: harnessInject
      security:
        - ConsoleSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InjectRequest"
      responses:
        "200":
          description: Pipeline trace result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineTrace"
        "401":
          description: Unauthorized.

  /harness/inject-and-store:
    post:
      tags: [Harness]
      summary: Inject and persist trace
      description: Same as `/harness/inject` but also stores the trace for history.
      operationId: harnessInjectAndStore
      security:
        - ConsoleSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InjectRequest"
      responses:
        "200":
          description: Pipeline trace result (also persisted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineTrace"
        "401":
          description: Unauthorized.

