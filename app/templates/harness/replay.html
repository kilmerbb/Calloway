{% extends "base.html" %}
{% block content %}
<div class="harness-layout" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">

<!-- Left Panel: Conversation Chat -->
<div class="section">
    <div class="section-title">Conversation Replay</div>

    <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
        <a href="/harness/" class="btn btn-sm btn-outline">Single Message</a>
        <a href="/harness/replay" class="btn btn-sm btn-outline" style="background: var(--accent); color: var(--bg);">Conversation Mode</a>
        <a href="/harness/history" class="btn btn-sm btn-outline">History</a>
        <a href="/harness/scenarios" class="btn btn-sm btn-outline">Scenarios</a>
    </div>

    <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
        <select id="agent-select" onchange="loadContacts()" style="flex: 1;" required>
            <option value="">Select agent...</option>
            {% for agent in agents %}
            <option value="{{ agent.id }}">{{ agent.name }}</option>
            {% endfor %}
        </select>
        <button class="btn btn-sm btn-outline" onclick="clearConversation()">Clear</button>
    </div>

    <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
        <button type="button" class="btn btn-sm btn-outline sender-mode active" data-mode="client" onclick="setSenderMode('client')">As Client</button>
        <button type="button" class="btn btn-sm btn-outline sender-mode" data-mode="agent" onclick="setSenderMode('agent')">As Agent</button>
        <button type="button" class="btn btn-sm btn-outline sender-mode" data-mode="unknown" onclick="setSenderMode('unknown')">As Unknown</button>
    </div>

    <div id="client-selector" style="margin-bottom: 0.5rem;">
        <select id="contact-select"><option value="">Select contact...</option></select>
    </div>
    <div id="unknown-phone" style="display: none; margin-bottom: 0.5rem;">
        <input type="text" id="manual-phone" placeholder="+15551234567" value="+15559990000">
    </div>

    <!-- Chat Messages -->
    <div id="chat-messages" style="min-height: 200px; max-height: 500px; overflow-y: auto; padding: 1rem; background: var(--bg); border-radius: 8px; margin-bottom: 0.5rem;">
        <p style="color: var(--text-muted); text-align: center;">Start a conversation...</p>
    </div>

    <form onsubmit="return sendReplayMessage(event)" style="display: flex; gap: 0.5rem;">
        <input type="text" id="replay-input" placeholder="Type a message..." style="flex: 1;" required>
        <label style="display: flex; align-items: center; gap: 0.25rem; margin: 0;"><input type="checkbox" id="replay-dry-run" checked> Dry</label>
        <button type="submit" class="btn btn-sm">Send</button>
    </form>
</div>

<!-- Right Panel: Trace for selected message -->
<div class="section" id="trace-panel">
    <div class="section-title">Pipeline Trace</div>
    <div id="trace-content" style="color: var(--text-muted);">
        <p>Click a message to view its pipeline trace.</p>
    </div>
</div>

</div>

<script>
let currentMode = 'client';
let conversationTraces = [];

function setSenderMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.sender-mode').forEach(b => b.classList.remove('active'));
    document.querySelector(`.sender-mode[data-mode="${mode}"]`).classList.add('active');
    document.getElementById('client-selector').style.display = mode === 'client' ? 'block' : 'none';
    document.getElementById('unknown-phone').style.display = mode === 'unknown' ? 'block' : 'none';
}

function loadContacts() {
    const agentId = document.getElementById('agent-select').value;
    if (!agentId) return;
    fetch('/harness/agents/' + agentId + '/contacts')
        .then(r => r.json())
        .then(contacts => {
            const sel = document.getElementById('contact-select');
            sel.innerHTML = '<option value="">Select contact...</option>';
            contacts.forEach(c => {
                sel.innerHTML += `<option value="${c.phone}" data-name="${c.name}">${c.name} (${c.phone})</option>`;
            });
        });
}

function getSenderPhone() {
    if (currentMode === 'client') return document.getElementById('contact-select').value || '+15559990000';
    if (currentMode === 'agent') return '';  // Will use agent phone
    return document.getElementById('manual-phone').value || '+15559990000';
}

function clearConversation() {
    conversationTraces = [];
    document.getElementById('chat-messages').innerHTML = '<p style="color: var(--text-muted); text-align: center;">Start a conversation...</p>';
    document.getElementById('trace-content').innerHTML = '<p>Click a message to view its pipeline trace.</p>';
}

async function sendReplayMessage(e) {
    e.preventDefault();
    const agentId = document.getElementById('agent-select').value;
    if (!agentId) { alert('Select an agent'); return false; }

    const messageBody = document.getElementById('replay-input').value;
    const senderPhone = getSenderPhone();

    const body = {
        agent_id: agentId,
        sender_phone: senderPhone,
        message_body: messageBody,
        channel: 'sms',
        dry_run: document.getElementById('replay-dry-run').checked,
    };

    // Add sent message to chat
    const chat = document.getElementById('chat-messages');
    if (conversationTraces.length === 0) chat.innerHTML = '';

    const msgIdx = conversationTraces.length;
    chat.innerHTML += `<div class="chat-msg chat-client" onclick="showTrace(${msgIdx})" style="cursor:pointer; text-align: right; margin: 0.5rem 0; padding: 0.5rem 0.75rem; background: var(--accent); color: var(--bg); border-radius: 12px 12px 0 12px; max-width: 80%; margin-left: auto;">${escapeHtml(messageBody)}</div>`;
    chat.scrollTop = chat.scrollHeight;
    document.getElementById('replay-input').value = '';

    try {
        const res = await fetch('/harness/inject-and-store', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body),
        });
        const trace = await res.json();
        conversationTraces.push(trace);

        if (trace.response_text) {
            chat.innerHTML += `<div class="chat-msg chat-ai" onclick="showTrace(${msgIdx})" style="cursor:pointer; margin: 0.5rem 0; padding: 0.5rem 0.75rem; background: var(--card-bg); border-radius: 12px 12px 12px 0; max-width: 80%;"><small style="color: var(--text-muted);">${trace.model_used || 'template'} | ${trace.intent_detected || ''}</small><br>${escapeHtml(trace.response_text)}</div>`;
        } else {
            chat.innerHTML += `<div style="margin: 0.5rem 0; color: var(--text-muted); font-size: 0.85rem; font-style: italic;">No response (${trace.intent_detected || 'unknown'})</div>`;
        }
        chat.scrollTop = chat.scrollHeight;
        showTrace(msgIdx);
    } catch (err) {
        chat.innerHTML += `<div style="color: var(--red); margin: 0.5rem 0;">Error: ${err.message}</div>`;
    }
    return false;
}

function showTrace(idx) {
    const trace = conversationTraces[idx];
    if (!trace) return;
    // Reuse renderStages from composer (will be defined inline)
    let html = `<div class="card" style="margin-bottom: 0.5rem;">`;
    html += `<small>Intent: <strong>${trace.intent_detected || 'N/A'}</strong> | Model: <strong>${trace.model_used || 'N/A'}</strong> | ${trace.total_duration_ms}ms</small>`;
    html += `</div>`;
    html += renderStagesSimple(trace.stages);
    document.getElementById('trace-content').innerHTML = html;
}

function renderStagesSimple(stages) {
    let html = '';
    stages.forEach((stage, i) => {
        const statusIcon = stage.status === 'success' ? '✓' : (stage.status === 'error' ? '✗' : '○');
        const statusColor = stage.status === 'success' ? 'var(--green)' : (stage.status === 'error' ? 'var(--red)' : 'var(--text-muted)');
        html += `<div class="card" style="margin-bottom: 0.25rem; padding: 0.5rem; cursor: pointer;" onclick="this.querySelector('.detail').style.display = this.querySelector('.detail').style.display === 'none' ? 'block' : 'none'">`;
        html += `<div style="display: flex; justify-content: space-between;"><strong>${stage.stage_name}</strong><span style="color: ${statusColor};">${statusIcon} ${stage.duration_ms}ms</span></div>`;
        html += `<div class="detail" style="display:none; margin-top: 0.5rem; font-size: 0.8rem;"><pre style="overflow: auto; max-height: 200px;">${escapeHtml(JSON.stringify(stage.output_summary || stage.full_output, null, 2))}</pre></div>`;
        html += `</div>`;
    });
    return html;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
{% endblock %}
