<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} — Calloway</title>
    <link rel="stylesheet" href="/static/console/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
<a href="#main-content" class="skip-nav">Skip to content</a>
<div class="layout">
    <button class="mobile-menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
        <span></span><span></span><span></span>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
        <div class="sidebar-logo">
            Calloway
            <small>Admin Console</small>
        </div>
        <a href="/console/dashboard" class="nav-item {% if active_nav == 'dashboard' %}active{% endif %}" title="System overview with key metrics and activity feed">Dashboard</a>
        <a href="/console/onboard" class="nav-item {% if active_nav == 'onboard' %}active{% endif %}" title="Step-by-step wizard to onboard a new real estate agent">Onboard Agent</a>
        <a href="/console/tenants" class="nav-item {% if active_nav == 'tenants' %}active{% endif %}" title="Manage real estate agent accounts">Tenants</a>
        <a href="/console/conversations" class="nav-item {% if active_nav == 'conversations' %}active{% endif %}" title="View all SMS, RCS, voice, and email conversations">Conversations</a>
        <a href="/console/triggers" class="nav-item {% if active_nav == 'triggers' %}active{% endif %}" title="Scheduled actions like follow-ups and reminders">Triggers</a>
        <a href="/console/errors" class="nav-item {% if active_nav == 'errors' %}active{% endif %}" title="Tool execution failures and application errors">Errors</a>
        <a href="/console/billing" class="nav-item {% if active_nav == 'billing' %}active{% endif %}" title="Subscription management, plan tiers, and revenue tracking">Billing</a>
        <a href="/console/costs" class="nav-item {% if active_nav == 'costs' %}active{% endif %}" title="LLM spend, token usage, and per-agent cost breakdown">Costs</a>
        <a href="/console/health" class="nav-item {% if active_nav == 'health' %}active{% endif %}" title="Service connectivity, latency metrics, and manual scans">Health</a>
        <a href="/harness/" class="nav-item {% if active_nav == 'harness' %}active{% endif %}" title="Test harness for simulating conversations">Harness</a>
        <a href="/console/manual" class="nav-item {% if active_nav == 'manual' %}active{% endif %}" title="Full user manual for every screen and feature">Manual</a>
        <a href="/console/logout" class="nav-item" style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 1rem;" title="End your session and return to the login screen">Logout</a>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <h1>{{ page_title }}</h1>
            <div hx-get="/console/health/status-dot" hx-trigger="load, every 30s" hx-swap="innerHTML" title="System health indicator — auto-refreshes every 30 seconds">
                <span class="status-dot status-yellow" title="Loading..."></span>
            </div>
        </header>
        <main class="content" id="main-content" role="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script>
(function() {
    var toggle = document.getElementById('menuToggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebarOverlay');
    function closeSidebar() {
        sidebar.classList.remove('open');
        toggle.classList.remove('active');
        overlay.classList.remove('active');
    }
    function openSidebar() {
        sidebar.classList.add('open');
        toggle.classList.add('active');
        overlay.classList.add('active');
    }
    toggle.addEventListener('click', function() {
        sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
    });
    overlay.addEventListener('click', closeSidebar);
    // Close on nav click (mobile)
    sidebar.querySelectorAll('.nav-item').forEach(function(link) {
        link.addEventListener('click', closeSidebar);
    });
})();
</script>
</body>
</html>
