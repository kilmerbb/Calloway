{% extends "base.html" %}
{% block content %}
{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="post" action="/console/tenants/{{ agent.id }}/edit" style="max-width: 600px;">
    <div class="section">
        <div class="section-title">Agent Profile</div>
        <div class="form-group"><label>Name</label><input type="text" name="name" value="{{ agent.name }}"></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ agent.email }}"></div>
        <div class="form-group"><label>Phone</label><input type="tel" name="phone" value="{{ agent.phone }}"></div>
        <div class="form-group"><label>Brokerage</label><input type="text" name="brokerage" value="{{ agent.brokerage or '' }}"></div>
        <div class="form-group"><label>Market</label><input type="text" name="market" value="{{ agent.market or '' }}"></div>
        <div class="form-group"><label>Timezone</label>
            <select name="timezone">
                {% for tz in ['America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles'] %}
                <option value="{{ tz }}" {% if agent.timezone == tz %}selected{% endif %}>{{ tz.split('/')[-1] }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Style & Autonomy</div>
        <div class="form-group"><label>Tone</label>
            <select name="tone">
                {% for t in ['professional', 'friendly', 'casual'] %}
                <option value="{{ t }}" {% if agent.style_profile and agent.style_profile.get('tone') == t %}selected{% endif %}>{{ t|capitalize }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group"><label>Autonomy Level</label>
            <select name="autonomy_level">
                {% for l in ['supervised', 'autonomous', 'manual'] %}
                <option value="{{ l }}" {% if agent.autonomy_rules and agent.autonomy_rules.get('level') == l %}selected{% endif %}>{{ l|capitalize }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Optional</div>
        <div class="form-group"><label>Google Review Link</label><input type="text" name="google_review_link" value="{{ agent.google_review_link or '' }}"></div>
        <div class="form-group"><label>Briefing Time</label><input type="time" name="briefing_time" value="{{ agent.briefing_time or '07:30' }}"></div>
        <div class="form-group"><label>System Prompt Override</label><textarea name="system_prompt">{{ agent.system_prompt or '' }}</textarea></div>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="/console/tenants/{{ agent.id }}" class="btn btn-outline" style="margin-left: 0.5rem;">Cancel</a>
</form>
{% endblock %}
