<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Calloway</title>
    <link rel="stylesheet" href="/static/agent/style.css">
</head>
<body>
<div class="login-container">
    <h1>Calloway</h1>
    <p class="subtitle">Your AI assistant is working. Sign in to see how.</p>

    {% if error %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}

    {% if message %}
    <div class="alert alert-success" role="status">{{ message }}</div>
    {% endif %}

    <form method="post" action="/agent/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="+15551234567" required autofocus autocomplete="tel">
        </div>
        <div class="form-group">
            <label for="code">Verification code</label>
            <input type="text" id="code" name="code" placeholder="Enter 6-digit code" inputmode="numeric" maxlength="6">
            <p class="form-hint">Text "LOGIN" to your Calloway number to receive a code.</p>
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
</div>
</body>
</html>
