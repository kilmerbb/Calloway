<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Calloway</title>
    <link rel="stylesheet" href="/static/agent/style.css">
</head>
<body>
<div class="login-container">
    <h1>Calloway</h1>
    <p class="subtitle">Your AI assistant is working. Sign in to see how.</p>

    {% if error %}
    <div style="background:var(--red-light); color:var(--red); padding:0.75rem; border-radius:10px; margin-bottom:1rem; font-size:14px;">{{ error }}</div>
    {% endif %}

    {% if message %}
    <div style="background:var(--green-light); color:var(--green); padding:0.75rem; border-radius:10px; margin-bottom:1rem; font-size:14px;">{{ message }}</div>
    {% endif %}

    <form method="post" action="/agent/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+15551234567" required autofocus>
        </div>
        <div class="form-group">
            <label for="code">Verification Code</label>
            <input type="text" id="code" name="code" placeholder="Enter 6-digit code" inputmode="numeric" maxlength="6">
            <p style="font-size:12px; color:var(--text-muted); margin-top:4px;">Text "LOGIN" to your Calloway number to receive a code.</p>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
</div>
</body>
</html>
